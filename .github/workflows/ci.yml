name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      platform:
        description: Platforms to validate and build (all, android, ios)
        type: string
        required: false
        default: all
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  JAVA_VERSION: '21'

jobs:
  metadata:
    name: Version and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      platform: ${{ steps.version.outputs.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - id: version
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: python3 scripts/release.py validate --platform "$PLATFORM" --github-output "$GITHUB_OUTPUT"
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

  android-build:
    name: Android build and lint
    needs: metadata
    if: ${{ needs.metadata.outputs.platform == 'all' || needs.metadata.outputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build both variants, lint and test shared logic
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug :shared:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-build-reports
          path: |
            app/build/reports/
            shared/build/reports/tests/
          retention-days: 7

  android-tests:
    name: Android tests (API ${{ matrix.api }})
    needs: metadata
    if: ${{ needs.metadata.outputs.platform == 'all' || needs.metadata.outputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
      - name: Run instrumentation tests on a disposable emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  ios:
    name: iOS tests and release archive
    needs: metadata
    if: ${{ needs.metadata.outputs.platform == 'all' || needs.metadata.outputs.platform == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Select an available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as stream:
              devices = json.load(stream)['devices']
          iphones = [d for runtime, group in devices.items() if '.iOS-' in runtime
                     for d in group if d['isAvailable'] and d['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No available iPhone simulator runtime installed')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('IOS_SIMULATOR_ID=' + iphones[0]['udid'] + '\n')
          PY
      - name: Run iOS unit tests
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath iosApp/build/DerivedData \
            -resultBundlePath iosApp/build/UnitTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test
      - name: Archive iOS app and widget without signing
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath iosApp/build/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
          mkdir -p iosApp/build/package/Payload
          cp -R iosApp/build/iosApp.xcarchive/Products/Applications/iosApp.app iosApp/build/package/Payload/
          test -d iosApp/build/package/Payload/iosApp.app/PlugIns/SleepDownWidgetExtension.appex
          (cd iosApp/build/package && zip -qry ../SleepDown-unsigned.ipa Payload)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-unsigned
          path: iosApp/build/SleepDown-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: iosApp/build/UnitTests.xcresult
          retention-days: 7

  gate:
    name: CI Gate
    if: always()
    needs: [metadata, android-build, android-tests, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected checks to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          PLATFORM: ${{ needs.metadata.outputs.platform }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          selected = {
              'all': {'metadata', 'android-build', 'android-tests', 'ios'},
              'android': {'metadata', 'android-build', 'android-tests'},
              'ios': {'metadata', 'ios'},
          }
          platform = os.environ['PLATFORM']
          if platform not in selected:
              raise SystemExit(f'Invalid CI platform: {platform!r}')
          required = selected[platform]
          expected = {name: ('success' if name in required else 'skipped')
                      for name in selected['all']}
          failed = {name: results.get(name, {}).get('result') for name, result in expected.items()
                    if results.get(name, {}).get('result') != result}
          if failed:
              raise SystemExit(f'CI gate failed for {platform}: {failed}')
          print(f'All required {platform} checks passed')
          PY
