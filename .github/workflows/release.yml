name: Release

on:
  push:
    tags: ['v*', 'ios-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      platform: ${{ steps.version.outputs.platform }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag from main
        run: |
          test "$GITHUB_REF_TYPE" = tag
          git merge-base --is-ancestor HEAD origin/main
      - id: version
        run: python3 scripts/release.py validate --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      platform: ${{ needs.version.outputs.platform }}
    permissions:
      contents: read

  android:
    name: Signed Android release
    needs: [version, checks]
    if: ${{ needs.version.outputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Build and verify signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SLEEPDOWN_KEYSTORE_FILE: ${{ runner.temp }}/sleepdown-release.jks
          SLEEPDOWN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SLEEPDOWN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SLEEPDOWN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          required = ['ANDROID_KEYSTORE_BASE64', 'SLEEPDOWN_KEYSTORE_PASSWORD',
                      'SLEEPDOWN_KEY_ALIAS', 'SLEEPDOWN_KEY_PASSWORD', 'ANDROID_SIGNING_CERT_SHA256']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing release secrets: ' + ', '.join(missing))
          data = base64.b64decode(''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split()), validate=True)
          with open(os.open(os.environ['SLEEPDOWN_KEYSTORE_FILE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'wb') as stream:
              stream.write(data)
          PY
          ./gradlew --no-daemon :app:assembleRelease -PsplitApks=true
          for abi in armeabi-v7a arm64-v8a; do
            apk="app/build/outputs/apk/release/app-$abi-release.apk"
            test -f "$apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
              "$apk" > "$RUNNER_TEMP/apk-signature-$abi.txt"
          done
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          expected = os.environ['ANDROID_SIGNING_CERT_SHA256'].replace(':', '').strip().lower()
          if not re.fullmatch('[a-f0-9]{64}', expected):
              raise SystemExit('Invalid ANDROID_SIGNING_CERT_SHA256')
          for abi in ('armeabi-v7a', 'arm64-v8a'):
              report = Path(os.environ['RUNNER_TEMP'], f'apk-signature-{abi}.txt').read_text()
              actual = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]+)$', report, re.M)
              if [value.lower() for value in actual] != [expected]:
                  raise SystemExit(f'{abi} APK signing certificate does not match ANDROID_SIGNING_CERT_SHA256')
          PY
          mkdir -p dist
          for abi in armeabi-v7a arm64-v8a; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/SleepDown-$VERSION-android-$abi.apk"
          done
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/sleepdown-release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-signed
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [version, checks, android]
    if: >-
      ${{ always() && needs.version.result == 'success' && needs.checks.result == 'success' &&
          ((needs.version.outputs.platform == 'android' && needs.android.result == 'success') ||
           (needs.version.outputs.platform == 'ios' && needs.android.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.version.outputs.platform == 'android' }}
        with:
          name: android-signed
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.version.outputs.platform == 'ios' }}
        with:
          name: ios-unsigned
          path: dist
      - name: Prepare notes and checksums
        id: assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ needs.version.outputs.platform }}
        run: |
          set -euo pipefail
          python3 scripts/release.py validate --platform "$PLATFORM" --tag "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          case "$PLATFORM" in
            android)
              assets=("SleepDown-$VERSION-android-armeabi-v7a.apk" "SleepDown-$VERSION-android-arm64-v8a.apk")
              ;;
            ios)
              assets=("SleepDown-$VERSION-ios-unsigned.ipa")
              mv dist/SleepDown-unsigned.ipa "dist/${assets[0]}"
              printf '\n\niOS IPA 未签名，安装前须自行签名主 App 和 Widget 扩展，并配置 App Group。\n' >> "$RUNNER_TEMP/RELEASE_NOTES.md"
              ;;
            *) echo "Unknown release platform: $PLATFORM" >&2; exit 1 ;;
          esac
          for asset in "${assets[@]}"; do
            test -f "dist/$asset"
          done
          (cd dist && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          printf 'assets=%s\n' "${assets[*]}" >> "$GITHUB_OUTPUT"
      - name: Publish only after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ needs.version.outputs.platform }}
          ASSETS: ${{ steps.assets.outputs.assets }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Refuse existing drafts as well as public releases; never overwrite a tag's assets.
          gh api --paginate --slurp "repos/$GH_REPO/releases" > "$RUNNER_TEMP/releases.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          pages = json.loads((temp / 'releases.json').read_text())
          if any(release['tag_name'] == os.environ['TAG'] for page in pages for release in page):
              raise SystemExit('A release or draft already exists for this tag; refusing to overwrite it')
          request = {
              'tag_name': os.environ['TAG'], 'target_commitish': os.environ['GITHUB_SHA'],
              'name': 'SleepDown ' + os.environ['TAG'], 'draft': True,
              'prerelease': os.environ['PRERELEASE'] == 'true',
              'body': (temp / 'RELEASE_NOTES.md').read_text(),
          }
          (temp / 'release-request.json').write_text(json.dumps(request))
          PY
          gh api --method POST "repos/$GH_REPO/releases" --input "$RUNNER_TEMP/release-request.json" > "$RUNNER_TEMP/release-created.json"
          release_id="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["id"]))' "$RUNNER_TEMP/release-created.json")"
          read -r -a assets <<< "$ASSETS"
          assets+=(SHA256SUMS.txt)
          for asset in "${assets[@]}"; do
            gh api --method POST "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=$asset" \
              --header 'Content-Type: application/octet-stream' --input "dist/$asset" --silent
          done
          test "$(gh api "repos/$GH_REPO/releases/$release_id/assets" --jq length)" = "${#assets[@]}"
          latest=false
          if [ "$PLATFORM" = android ] && [ "$PRERELEASE" = false ]; then latest=true; fi
          # Publish the exact draft created above, never resolve a mutable tag again.
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -F prerelease="$PRERELEASE" -f make_latest="$latest" --silent
